name: Build macOS DMG
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-macos.txt
      - name: Check source and crop regression
        run: |
          python -m py_compile server.py cropmarks.py toc.py packaging/mac_launcher.py
          python -m unittest discover -s tools -p 'test_*.py'
          node --check web/js/studio.js
          node --check web/js/viewer.js
      - name: Build and verify signed bundle and disk image
        run: python packaging/build_macos.py
      - name: Test executable from read-only DMG
        shell: bash
        run: |
          set -euo pipefail
          mount_path="$RUNNER_TEMP/flipbook-dmg"
          mkdir -p "$mount_path"
          hdiutil attach "dist/FlipbookStudio-macOS-${{ matrix.arch }}.dmg" -nobrowse -readonly -mountpoint "$mount_path"
          cleanup() {
            for attempt in 1 2 3 4 5; do
              if hdiutil detach "$mount_path"; then return 0; fi
              sleep 2
            done
            return 1
          }
          trap cleanup EXIT
          python packaging/smoke_macos.py "$mount_path/Flipbook Studio.app/Contents/MacOS/Flipbook Studio"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlipbookStudio-macOS-${{ matrix.arch }}
          path: dist/FlipbookStudio-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
